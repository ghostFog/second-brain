<div class="view-row" style="background: var(--note-background);">
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- 头部 -->
    <div class="px-6 py-4 border-b shrink-0" style="border-color: var(--note-border); background: var(--note-surface);">
      <div class="flex items-end justify-between mb-4">
        <div>
          <h1 class="text-h1" style="color: var(--note-ink);">插件市场</h1>
          <p class="text-caption mt-1" style="color: var(--note-ink-2);">发现扩展你的笔记工作流</p>
        </div>
        <button data-action="toggle-installed" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-caption transition-colors hover:opacity-80" style="color: var(--note-ink-2); background: var(--note-surface-2); border: 1px solid var(--note-border);">
          <i data-lucide="package-check" class="w-4 h-4"></i>管理已安装插件
        </button>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex-1 relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--note-ink-3);"></i>
          <input id="plugin-search" type="text" placeholder="搜索插件..." class="w-full pl-9 pr-3 py-2 rounded-lg text-body border outline-none" style="border-color: var(--note-border); background: var(--note-background); color: var(--note-ink);">
        </div>
        <div class="relative">
          <select id="plugin-sort" class="appearance-none pl-3 pr-9 py-2 rounded-lg text-caption border cursor-pointer outline-none" style="border-color: var(--note-border); background: var(--note-background); color: var(--note-ink);">
            <option value="popular">最热门</option>
            <option value="latest">最新</option>
            <option value="rating">评分最高</option>
          </select>
          <i data-lucide="chevron-down" class="w-4 h-4 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--note-ink-3);"></i>
        </div>
      </div>

      <div id="plugin-chips" class="flex items-center gap-2 mt-4 flex-wrap">
        <button class="chip-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-caption font-medium" data-cat="all" style="background: var(--note-brand-600); color: #FFFFFF; border: 1px solid var(--note-brand-600);"><i data-lucide="layers" class="w-3.5 h-3.5"></i>全部</button>
        <button class="chip-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-caption" data-cat="editor" style="background: var(--note-background); color: var(--note-ink-2); border: 1px solid var(--note-border);"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i>编辑器增强</button>
        <button class="chip-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-caption" data-cat="theme" style="background: var(--note-background); color: var(--note-ink-2); border: 1px solid var(--note-border);"><i data-lucide="palette" class="w-3.5 h-3.5"></i>主题外观</button>
        <button class="chip-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-caption" data-cat="sync" style="background: var(--note-background); color: var(--note-ink-2); border: 1px solid var(--note-border);"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>数据同步</button>
        <button class="chip-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-caption" data-cat="productivity" style="background: var(--note-background); color: var(--note-ink-2); border: 1px solid var(--note-border);"><i data-lucide="zap" class="w-3.5 h-3.5"></i>生产力工具</button>
        <button class="chip-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-caption" data-cat="integration" style="background: var(--note-background); color: var(--note-ink-2); border: 1px solid var(--note-border);"><i data-lucide="link" class="w-3.5 h-3.5"></i>集成服务</button>
      </div>
    </div>

    <!-- 卡片网格 -->
    <div class="app-scroll pm-scroll px-6 py-4">
      <div id="plugin-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </div>
  </div>

  <!-- 右侧详情抽屉（默认折叠） -->
  <aside id="plugin-drawer" class="resp-sidebar w-0 overflow-hidden border-l transition-all duration-200" style="border-color: var(--note-border); background: var(--note-surface);"></aside>
</div>

<!-- 插件数据统一由 js/app-plugins.js 的 DEFAULT_PLUGIN_DATA 提供（单一数据源）；
     如需保留内嵌数据，请与 DEFAULT_PLUGIN_DATA 保持字段一致（含 manifest）。 -->
<script id="plugin-data" type="application/json">
[]
</script>
