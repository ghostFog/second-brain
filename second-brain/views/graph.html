<div class="view-row" style="background: var(--note-background);">
  <!-- ===== 左侧过滤面板 ===== -->
  <aside class="resp-leaf w-[220px] shrink-0 flex flex-col border-r overflow-y-auto no-scrollbar" style="border-color: var(--note-border); background: var(--note-surface);">
    <div class="px-4 py-3 border-b flex items-center justify-between shrink-0" style="border-color: var(--note-border);">
      <span class="text-[13px] font-semibold tracking-wide" style="color: var(--note-ink);">过滤器</span>
      <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5" style="color: var(--note-ink-3);"></i>
    </div>

    <div class="px-4 py-3">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--note-ink-3);">标签过滤</span>
        <span id="graph-tag-count" class="text-[10px] nums" style="color: var(--note-ink-3);">0/0</span>
      </div>
      <div id="graph-tags" class="space-y-1.5"></div>
    </div>

    <div class="mx-4 border-t" style="border-color: var(--note-border);"></div>

    <div class="px-4 py-3">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--note-ink-3);">连接深度</span>
        <span id="graph-depth-label" class="text-[10px] nums px-1.5 py-0.5 rounded" style="color: var(--note-brand-400); background: rgba(124,58,237,0.12);">2层</span>
      </div>
      <div class="flex items-center gap-1">
        <button class="depth-btn flex-1 py-1.5 rounded text-[11px] font-medium transition-colors" data-depth="1" style="color: var(--note-ink-3); background: var(--note-surface-2);">1层</button>
        <button class="depth-btn flex-1 py-1.5 rounded text-[11px] font-medium transition-colors" data-depth="2" style="color: #FFFFFF; background: var(--note-brand-600);">2层</button>
        <button class="depth-btn flex-1 py-1.5 rounded text-[11px] font-medium transition-colors" data-depth="3" style="color: var(--note-ink-3); background: var(--note-surface-2);">3层</button>
      </div>
      <div class="mt-3 relative h-1 rounded-full" style="background: var(--note-surface-2);">
        <div id="depth-fill" class="absolute left-0 top-0 h-1 rounded-full" style="width: 66%; background: var(--note-brand-600);"></div>
        <div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 rounded-full border-2 shadow" style="left: calc(66% - 6px); background: #FFFFFF; border-color: var(--note-brand-600);"></div>
      </div>
    </div>

    <div class="mx-4 border-t" style="border-color: var(--note-border);"></div>

    <div class="px-4 py-3">
      <div class="flex items-center justify-between mb-2.5"><span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--note-ink-3);">节点类型</span></div>
      <div class="space-y-1.5">
        <label class="flex items-center gap-2 cursor-pointer group py-1"><input type="checkbox" class="sr-only peer" data-type="note" checked><span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);"><i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i></span><i data-lucide="file-text" class="w-3 h-3" style="color: var(--note-ink-2);"></i><span class="text-[12px] flex-1" style="color: var(--note-ink);">笔记</span><span id="cnt-note" class="text-[11px] nums" style="color: var(--note-ink-3);">0</span></label>
        <label class="flex items-center gap-2 cursor-pointer group py-1"><input type="checkbox" class="sr-only peer" data-type="folder" checked><span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);"><i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i></span><i data-lucide="folder" class="w-3 h-3" style="color: var(--note-ink-2);"></i><span class="text-[12px] flex-1" style="color: var(--note-ink);">文件夹</span><span id="cnt-folder" class="text-[11px] nums" style="color: var(--note-ink-3);">0</span></label>
        <label class="flex items-center gap-2 cursor-pointer group py-1"><input type="checkbox" class="sr-only peer" data-type="tag" checked><span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);"><i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i></span><i data-lucide="hash" class="w-3 h-3" style="color: var(--note-ink-2);"></i><span class="text-[12px] flex-1" style="color: var(--note-ink);">标签</span><span id="cnt-tag" class="text-[11px] nums" style="color: var(--note-ink-3);">0</span></label>
      </div>
    </div>

    <div class="mt-auto px-4 py-3 border-t" style="border-color: var(--note-border);">
      <button data-action="graph-reset" class="w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-[12px] font-medium border transition-colors hover:opacity-80" style="border-color: var(--note-border); color: var(--note-ink-2); background: var(--note-surface-2);">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>重置</span>
      </button>
    </div>
  </aside>

  <!-- ===== 中间图谱画布 ===== -->
  <section class="flex-1 flex flex-col overflow-hidden" style="background: var(--note-background);">
    <div class="h-10 shrink-0 flex items-center justify-between px-3 border-b" style="border-color: var(--note-border); background: var(--note-surface);">
      <div class="flex items-center gap-2">
        <div class="flex items-center rounded-md p-0.5" style="background: var(--note-surface-2);">
          <button class="layout-btn flex items-center gap-1.5 px-2.5 py-1 rounded text-[11px] font-medium transition-colors" data-layout="force" style="color: #FFFFFF; background: var(--note-brand-600);">
            <i data-lucide="git-fork" class="w-3 h-3"></i><span>力导向</span>
          </button>
          <button class="layout-btn flex items-center gap-1.5 px-2.5 py-1 rounded text-[11px] font-medium transition-colors hover:opacity-80" data-layout="tree" style="color: var(--note-ink-2);">
            <i data-lucide="list-tree" class="w-3 h-3"></i><span>层级</span>
          </button>
        </div>
        <div class="w-px h-4" style="background: var(--note-border);"></div>
        <span id="graph-stats" class="text-[11px] nums" style="color: var(--note-ink-3);">节点 0 · 连接 0</span>
      </div>
      <div class="flex items-center gap-1">
        <button data-action="zoom-out" class="w-7 h-7 flex items-center justify-center rounded-md border transition-colors hover:opacity-80" style="border-color: var(--note-border); color: var(--note-ink-2); background: var(--note-surface-2);" title="缩小"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
        <span id="zoom-label" class="text-[11px] nums px-2 min-w-[40px] text-center" style="color: var(--note-ink-2);">100%</span>
        <button data-action="zoom-in" class="w-7 h-7 flex items-center justify-center rounded-md border transition-colors hover:opacity-80" style="border-color: var(--note-border); color: var(--note-ink-2); background: var(--note-surface-2);" title="放大"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
        <button data-action="zoom-fit" class="w-7 h-7 flex items-center justify-center rounded-md border transition-colors hover:opacity-80 ml-1" style="border-color: var(--note-border); color: var(--note-ink-2); background: var(--note-surface-2);" title="重置视图"><i data-lucide="maximize-2" class="w-3.5 h-3.5"></i></button>
      </div>
    </div>

    <div id="graph-canvas" class="flex-1 relative overflow-hidden" style="background: var(--note-background);">
      <div id="graph-bg" class="absolute inset-0 opacity-30" style="background-image: radial-gradient(circle, var(--note-border) 1px, transparent 1px); background-size: 24px 24px;"></div>
      <svg id="graph-svg" viewBox="0 0 800 500" class="w-full h-full relative" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="gradCenter" cx="40%" cy="35%"><stop offset="0%" stop-color="#A78BFA" /><stop offset="100%" stop-color="#7C3AED" /></radialGradient>
          <radialGradient id="gradNode" cx="40%" cy="35%"><stop offset="0%" stop-color="#3D3D52" /><stop offset="100%" stop-color="#333346" /></radialGradient>
          <radialGradient id="gradHighlight" cx="40%" cy="35%"><stop offset="0%" stop-color="#5B3FAA" /><stop offset="100%" stop-color="#4C1D95" /></radialGradient>
        </defs>
        <g id="graph-links" stroke="var(--note-border)" fill="none"></g>
        <g id="graph-nodes"></g>
      </svg>

      <div class="absolute bottom-3 left-3 px-3 py-2 rounded-lg border text-[11px] flex items-center gap-4" style="border-color: var(--note-border); background: rgba(45,45,63,0.92); backdrop-filter: blur(8px);">
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background: var(--note-brand-600);"></span><span style="color: var(--note-ink-2);">当前节点</span></div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background: var(--note-brand-400);"></span><span style="color: var(--note-ink-2);">选中</span></div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background: var(--note-surface-2); border: 1px solid var(--note-border);"></span><span style="color: var(--note-ink-2);">普通</span></div>
      </div>
      <div class="absolute bottom-3 right-3 px-2.5 py-1.5 rounded-md border text-[10px] flex items-center gap-1.5" style="border-color: var(--note-border); background: rgba(45,45,63,0.92); color: var(--note-ink-3);">
        <i data-lucide="mouse-pointer-2" class="w-3 h-3"></i><span>拖拽平移 · 滚轮缩放</span>
      </div>
    </div>
  </section>

  <!-- ===== 右侧节点详情面板 ===== -->
  <aside class="resp-sidebar w-[260px] shrink-0 flex flex-col border-l overflow-y-auto no-scrollbar" style="border-color: var(--note-border); background: var(--note-surface);">
    <div class="px-4 py-3 border-b flex items-center justify-between shrink-0" style="border-color: var(--note-border);">
      <span class="text-[13px] font-semibold tracking-wide" style="color: var(--note-ink);">节点详情</span>
      <div class="flex items-center gap-1"><i data-lucide="info" class="w-3.5 h-3.5" style="color: var(--note-ink-3);"></i></div>
    </div>

    <div class="px-4 py-4 border-b" style="border-color: var(--note-border);">
      <div class="flex items-start gap-2.5">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background: var(--note-brand-600);"><i data-lucide="file-text" class="w-4 h-4" style="color: #FFFFFF;"></i></div>
        <div class="flex-1 min-w-0">
          <div id="gd-name" class="text-[14px] font-semibold leading-tight" style="color: var(--note-ink);">—</div>
          <div class="flex items-center gap-1 mt-1"><span id="gd-cat" class="text-[10px] px-1.5 py-0.5 rounded" style="background: rgba(124,58,237,0.15); color: var(--note-brand-400);">—</span><span id="gd-conn" class="text-[10px] nums" style="color: var(--note-ink-3);">· 0 连接</span></div>
        </div>
      </div>
    </div>

    <div class="px-4 py-3 border-b" style="border-color: var(--note-border);">
      <div class="text-[11px] font-semibold uppercase tracking-wider mb-2.5" style="color: var(--note-ink-3);">基本信息</div>
      <div id="gd-basic" class="space-y-2.5 text-[11px]" style="color: var(--note-ink-2);">—</div>
    </div>

    <div class="px-4 py-3 border-b" style="border-color: var(--note-border);">
      <div class="text-[11px] font-semibold uppercase tracking-wider mb-2.5" style="color: var(--note-ink-3);">标签</div>
      <div id="gd-tags" class="flex flex-wrap gap-1.5">—</div>
    </div>

    <div class="px-4 py-3 flex-1">
      <div class="flex items-center justify-between mb-2.5"><span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--note-ink-3);">连接</span><span id="gd-link-count" class="text-[10px] nums px-1.5 py-0.5 rounded" style="color: var(--note-brand-400); background: rgba(124,58,237,0.12);">0</span></div>
      <div id="gd-links" class="space-y-1"></div>
    </div>

    <div class="px-4 py-3 border-t" style="border-color: var(--note-border);">
      <button class="w-full flex items-center justify-center gap-1.5 py-2.5 rounded-md text-[13px] font-medium transition-colors hover:opacity-90" data-action="open-graph-note" style="background: var(--note-brand-600); color: #FFFFFF;"><i data-lucide="external-link" class="w-4 h-4"></i><span>打开笔记</span></button>
    </div>
  </aside>
</div>
