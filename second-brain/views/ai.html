<div class="view-row flex" style="background: var(--note-background);">
  <!-- ===== 左侧会话列表侧栏（支持展开/收起） ===== -->
  <aside id="ai-sidebar" class="flex flex-col shrink-0 border-r" style="width: 220px; border-color: var(--note-border); background: var(--note-surface);">
    <div class="h-12 shrink-0 flex items-center gap-2 px-3 border-b" style="border-color: var(--note-border);">
      <i data-lucide="message-square" class="w-4 h-4 shrink-0" style="color: var(--note-brand-400);"></i>
      <span class="text-[13px] font-semibold" style="color: var(--note-ink);">会话</span>
      <span id="ai-session-count" class="text-[11px] nums" style="color: var(--note-ink-3);"></span>
      <div class="flex-1"></div>
      <button data-ai="collapse-side" class="w-7 h-7 flex items-center justify-center rounded-md transition-colors hover:opacity-80" style="color: var(--note-ink-3);" title="收起会话列表">
        <i data-lucide="panel-left-close" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="ai-session-list" class="flex-1 overflow-y-auto app-scroll py-1"></div>
  </aside>

  <!-- ===== 会话列表收起后的展开把手 ===== -->
  <button id="ai-sidebar-open" class="edge-toggle" style="left: 54px; color: var(--note-ink-3);" title="展开会话列表">
    <i data-lucide="panel-left-open" class="w-4 h-4"></i>
  </button>

  <!-- ===== 主列（顶部工具栏 + 对话区 + 底部输入区） ===== -->
  <div class="flex-1 min-w-0 flex flex-col" style="background: var(--note-background);">
    <!-- ===== 顶部工具栏 (48px)，不再含模型选择器（已移至底部输入区） ===== -->
    <div class="h-12 shrink-0 flex items-center gap-3 px-4 border-b" style="border-color: var(--note-border); background: var(--note-surface);">
      <div class="w-7 h-7 rounded-md flex items-center justify-center flex-shrink-0" style="background: var(--note-brand-600);"><i data-lucide="brain" class="w-4 h-4" style="color: #FFFFFF;"></i></div>
      <div class="leading-tight">
        <div class="text-[13px] font-semibold" style="color: var(--note-ink);">AI 问答</div>
        <div class="text-[10px]" style="color: var(--note-ink-3);">基于本地知识库的语义问答</div>
      </div>
      <div class="flex-1"></div>
      <span id="ai-status" class="flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full border" style="border-color: var(--note-border); color: var(--note-ink-2); background: var(--note-surface-2);">
        <span id="ai-status-dot" class="w-1.5 h-1.5 rounded-full" style="background: var(--note-ink-3);"></span>
        <span id="ai-status-text">未加载</span>
      </span>
      <div class="relative" id="ai-index-dd">
        <button data-ai="index-menu-toggle" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] font-medium border transition-colors hover:opacity-80" style="border-color: var(--note-border); color: var(--note-ink-2); background: var(--note-surface-2);" title="管理各知识库索引：重建 / 清理残留">
          <i data-lucide="database" class="w-3.5 h-3.5"></i><span>索引库</span><i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>
        <div id="ai-index-menu" class="absolute right-0 top-full mt-1.5 w-80 rounded-lg border app-scroll" style="display:none; z-index: 90; max-height: 62vh; overflow-y: auto; border-color: var(--note-border); background: var(--note-popover); box-shadow: var(--note-shadow-3);">
          <div class="h-9 px-3 flex items-center justify-between border-b sticky top-0 text-[12px] font-semibold" style="border-color: var(--note-border); color: var(--note-ink); background: var(--note-popover);">
            <span>索引库</span>
            <button data-ai="index-menu-close" title="关闭" class="w-6 h-6 flex items-center justify-center rounded hover:opacity-80" style="color: var(--note-ink-3);"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
          </div>
          <div id="ai-index-menu-body" class="py-1.5 px-2"></div>
        </div>
      </div>
      <button data-ai="new" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] font-medium transition-colors hover:opacity-90" style="background: var(--note-brand-600); color: #FFFFFF;" title="新建会话，开始一段新的对话">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i><span>新建会话</span>
      </button>
    </div>

    <!-- ===== 对话区 ===== -->
    <div id="ai-chat" class="flex-1 overflow-y-auto app-scroll"></div>

    <!-- ===== 底部输入区：左「模型选择器」下拉 + 中输入框 + 右「发送」 ===== -->
    <div class="shrink-0 px-4 py-3 border-t" style="border-color: var(--note-border); background: var(--note-surface);">
      <div class="flex items-center gap-2 max-w-3xl mx-auto">
        <div class="relative flex items-center shrink-0" title="选择生成模型">
          <i data-lucide="cpu" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--note-ink-3);"></i>
          <select id="ai-model" class="select-box text-[12px] py-2" style="padding-left: 30px; padding-right: 30px;" aria-label="选择生成模型">
            <option value="">加载模型…</option>
          </select>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--note-ink-3);"></i>
        </div>
        <textarea id="ai-input" rows="1" placeholder="输入问题，从你的笔记库中寻找答案（Enter 发送，Shift+Enter 换行）"
          class="flex-1 resize-none outline-none rounded-lg px-3 py-2.5 text-[13px] leading-relaxed"
          style="background: var(--note-surface-2); border: 1px solid var(--note-border); color: var(--note-ink); max-height: 120px; box-shadow: none;"></textarea>
        <button data-ai="send" class="shrink-0 px-4 h-9 flex items-center justify-center rounded-lg text-[13px] font-medium transition-colors hover:opacity-90" style="background: var(--note-brand-600); color: #FFFFFF;" title="发送（Enter）">
          <span>发送</span>
        </button>
      </div>
    </div>
  </div>
</div>
