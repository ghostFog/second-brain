<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteApp - 图谱视图</title>
    <style id="theme-vars">
/* ============================================
 * NoteApp Brand CSS — Obsidian-Inspired Theme
 * Brand prefix: note
 * Single brand hue: Violet (#7C3AED)
 * ============================================ */

/* === Design Tokens (shared) === */
:root {
  /* Brand primary hue — Violet (Obsidian-inspired) */
  --note-brand-50: #F5F3FF;
  --note-brand-100: #EDE9FE;
  --note-brand-200: #DDD6FE;
  --note-brand-300: #C4B5FD;
  --note-brand-400: #A78BFA;
  --note-brand-500: #8B5CF6;
  --note-brand-600: #7C3AED;
  --note-brand-700: #6D28D9;
  --note-brand-800: #5B21B6;
  --note-brand-900: #4C1D95;
  --note-brand-950: #2E1065;

  /* Neutral scale — cool dark gray */
  --note-neutral-0: #FFFFFF;
  --note-neutral-50: #F7F7FA;
  --note-neutral-100: #ECECF2;
  --note-neutral-200: #D9D9E3;
  --note-neutral-300: #B8B8C8;
  --note-neutral-400: #9494A8;
  --note-neutral-500: #6B6B7B;
  --note-neutral-600: #525262;
  --note-neutral-700: #3F3F50;
  --note-neutral-800: #2D2D3F;
  --note-neutral-900: #1E1E2E;
  --note-neutral-950: #141419;

  /* State colors — semantic only */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Radius scale — restrained */
  --note-radius-sm: 4px;
  --note-radius-md: 8px;
  --note-radius-lg: 12px;
  --note-radius-full: 9999px;

  /* Typography */
  --note-font-sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --note-font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;

  /* Type scale */
  --note-text-display: clamp(32px, 4vw, 48px);
  --note-text-h1: clamp(24px, 2.5vw, 36px);
  --note-text-h2: clamp(20px, 2vw, 28px);
  --note-text-h3: 18px;
  --note-text-body-l: 17px;
  --note-text-body: 15px;
  --note-text-caption: 13px;
  --note-text-mono: 13px;
}

/* === Dark Mode (default) === */
:root {
  --note-background: var(--note-neutral-900);
  --note-foreground: #DCDCE4;
  --note-card: var(--note-neutral-800);
  --note-card-foreground: #DCDCE4;
  --note-popover: var(--note-neutral-800);
  --note-popover-foreground: #DCDCE4;
  --note-primary: var(--note-brand-600);
  --note-primary-foreground: #FFFFFF;
  --note-muted: var(--note-neutral-800);
  --note-muted-foreground: #9B9BA8;
  --note-border: var(--note-neutral-700);
  --note-input: var(--note-neutral-700);
  --note-ring: var(--note-brand-600);

  /* Extended semantic tokens */
  --note-surface: var(--note-neutral-800);
  --note-surface-2: #333346;
  --note-ink: #DCDCE4;
  --note-ink-2: #9B9BA8;
  --note-ink-3: #6B6B7B;
  --note-line: var(--note-neutral-700);
  --note-brand: var(--note-brand-600);
  --note-brand-ink: #FFFFFF;

  /* Shadows — dark mode */
  --note-shadow-1: 0 1px 2px rgba(0,0,0,0.2), 0 1px 1px rgba(0,0,0,0.1);
  --note-shadow-2: 0 8px 24px -8px rgba(0,0,0,0.5);
  --note-shadow-3: 0 24px 60px -20px rgba(0,0,0,0.6);
}

/* === Light Mode === */
html.light {
  --note-background: var(--note-neutral-0);
  --note-foreground: var(--note-neutral-900);
  --note-card: var(--note-neutral-50);
  --note-card-foreground: var(--note-neutral-900);
  --note-popover: var(--note-neutral-0);
  --note-popover-foreground: var(--note-neutral-900);
  --note-primary: var(--note-brand-600);
  --note-primary-foreground: #FFFFFF;
  --note-muted: var(--note-neutral-100);
  --note-muted-foreground: var(--note-neutral-500);
  --note-border: var(--note-neutral-200);
  --note-input: var(--note-neutral-200);
  --note-ring: var(--note-brand-600);

  --note-surface: var(--note-neutral-50);
  --note-surface-2: var(--note-neutral-100);
  --note-ink: var(--note-neutral-900);
  --note-ink-2: var(--note-neutral-500);
  --note-ink-3: var(--note-neutral-400);
  --note-line: var(--note-neutral-200);

  /* Shadows — light mode */
  --note-shadow-1: 0 1px 2px rgba(15,23,42,0.05), 0 1px 1px rgba(15,23,42,0.03);
  --note-shadow-2: 0 8px 24px -8px rgba(15,23,42,0.18);
  --note-shadow-3: 0 24px 60px -20px rgba(15,23,42,0.30);
}

/* === Typography utility classes === */
.font-sans { font-family: var(--note-font-sans); }
.font-mono { font-family: var(--note-font-mono); }

.text-display { font-size: var(--note-text-display); line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
.text-h1 { font-size: var(--note-text-h1); line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
.text-h2 { font-size: var(--note-text-h2); line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.text-h3 { font-size: var(--note-text-h3); line-height: 1.3; font-weight: 600; }
.text-body-l { font-size: var(--note-text-body-l); line-height: 1.6; font-weight: 400; }
.text-body { font-size: var(--note-text-body); line-height: 1.6; font-weight: 400; }
.text-caption { font-size: var(--note-text-caption); line-height: 1.5; font-weight: 400; }
.text-mono { font-family: var(--note-font-mono); font-size: var(--note-text-mono); line-height: 1.5; font-weight: 500; }

.nums { font-variant-numeric: tabular-nums; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--note-background);
    --color-foreground: var(--note-foreground);
    --color-card: var(--note-card);
    --color-card-foreground: var(--note-card-foreground);
    --color-popover: var(--note-popover);
    --color-popover-foreground: var(--note-popover-foreground);
    --color-primary: var(--note-primary);
    --color-primary-foreground: var(--note-primary-foreground);
    --color-muted: var(--note-muted);
    --color-muted-foreground: var(--note-muted-foreground);
    --color-border: var(--note-border);
    --color-input: var(--note-input);
    --color-ring: var(--note-ring);
    --radius-sm: var(--note-radius-sm);
    --radius-md: var(--note-radius-md);
    --radius-lg: var(--note-radius-lg);
  }
  @layer base {
    body { background: var(--note-background); color: var(--note-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--note-background); }
      .text-background { color: var(--note-background); }
      .border-background { border-color: var(--note-background); }
      .ring-background { --tw-ring-color: var(--note-background); }
      .bg-foreground { background-color: var(--note-foreground); }
      .text-foreground { color: var(--note-foreground); }
      .border-foreground { border-color: var(--note-foreground); }
      .ring-foreground { --tw-ring-color: var(--note-foreground); }
      .bg-card { background-color: var(--note-card); }
      .text-card { color: var(--note-card); }
      .border-card { border-color: var(--note-card); }
      .ring-card { --tw-ring-color: var(--note-card); }
      .bg-card-foreground { background-color: var(--note-card-foreground); }
      .text-card-foreground { color: var(--note-card-foreground); }
      .border-card-foreground { border-color: var(--note-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--note-card-foreground); }

      .border-popover-foreground { border-color: var(--note-popover-foreground); }

      .bg-primary { background-color: var(--note-primary); }
      .text-primary { color: var(--note-primary); }
      .border-primary { border-color: var(--note-primary); }
      .ring-primary { --tw-ring-color: var(--note-primary); }
      .bg-primary-foreground { background-color: var(--note-primary-foreground); }
      .text-primary-foreground { color: var(--note-primary-foreground); }
      .border-primary-foreground { border-color: var(--note-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--note-primary-foreground); }
      .bg-muted { background-color: var(--note-muted); }
      .text-muted { color: var(--note-muted); }
      .border-muted { border-color: var(--note-muted); }
      .ring-muted { --tw-ring-color: var(--note-muted); }
      .bg-muted-foreground { background-color: var(--note-muted-foreground); }
      .text-muted-foreground { color: var(--note-muted-foreground); }
      .border-muted-foreground { border-color: var(--note-muted-foreground); }

      .bg-border { background-color: var(--note-border); }
      .text-border { color: var(--note-border); }
      .border-border { border-color: var(--note-border); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      /* 图谱脉冲动画 */
      @keyframes graph-pulse {
        0% { r: 32; opacity: 0.5; }
        100% { r: 52; opacity: 0; }
      }
      @keyframes graph-pulse-small {
        0% { r: 24; opacity: 0.4; }
        100% { r: 42; opacity: 0; }
      }
      .pulse-ring-center {
        transform-origin: center;
        transform-box: fill-box;
        animation: graph-pulse 2.8s ease-out infinite;
      }
      .pulse-ring-side {
        transform-origin: center;
        transform-box: fill-box;
        animation: graph-pulse-small 3.4s ease-out infinite;
      }
      /* 节点悬浮效果 */
      .graph-node { cursor: pointer; transition: opacity 0.2s ease; }
      .graph-node:hover { opacity: 0.85; }
      .graph-link { transition: stroke-opacity 0.2s ease; }
      /* 连接线流动动画 */
      @keyframes dash-flow {
        to { stroke-dashoffset: -20; }
      }
      .link-flow {
        stroke-dasharray: 4 6;
        animation: dash-flow 1.6s linear infinite;
      }
    </style>
</head>
<body class="h-screen overflow-hidden font-sans antialiased" style="background: var(--note-background); color: var(--note-foreground);">
    <main class="h-screen flex flex-col">
      <!-- ===== Title Bar (36px) ===== -->
      <header class="h-9 flex items-center justify-between px-3 border-b" style="border-color: var(--note-border); background: var(--note-surface);">
        <!-- Left: traffic lights + vault name -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full" style="background:#FF5F57;"></span>
            <span class="w-3 h-3 rounded-full" style="background:#FEBC2E;"></span>
            <span class="w-3 h-3 rounded-full" style="background:#28C840;"></span>
          </div>
          <div class="flex items-center gap-1.5 text-[13px]" style="color: var(--note-ink-2);">
            <i data-lucide="book" class="w-3.5 h-3.5"></i>
            <span style="color: var(--note-ink);">我的笔记库</span>
          </div>
        </div>
        <!-- Center: breadcrumb -->
        <div class="flex items-center gap-1 text-[12px]" style="color: var(--note-ink-3);">
          <span>图谱视图</span>
          <i data-lucide="chevron-right" class="w-3 h-3"></i>
          <span style="color: var(--note-ink-2);">2024年9月1日</span>
        </div>
        <!-- Right: command palette trigger + window actions -->
        <div class="flex items-center gap-2">
          <button data-dom-id="open-command-palette" class="flex items-center gap-1.5 px-2 py-1 rounded text-[12px] border transition-colors hover:opacity-80" style="border-color: var(--note-border); color: var(--note-ink-3); background: var(--note-surface-2);">
            <i data-lucide="search" class="w-3 h-3"></i>
            <span>搜索</span>
            <kbd class="text-[10px] px-1 rounded" style="background: var(--note-surface); color: var(--note-ink-3);">⌘P</kbd>
          </button>
        </div>
      </header>

      <!-- ===== Main Row: Ribbon + Content ===== -->
      <div class="flex-1 flex overflow-hidden">
        <!-- ===== Ribbon (48px) ===== -->
        <nav class="w-12 flex flex-col items-center py-3 gap-1 border-r" style="border-color: var(--note-border); background: var(--note-surface);">
          <!-- File / Editor -->
          <button data-nav-key="file" data-dom-id="nav-editor" class="w-9 h-9 flex items-center justify-center rounded-md transition-colors hover:opacity-80" style="color: var(--note-ink-2);" title="编辑器">
            <i data-lucide="file-text" class="w-5 h-5"></i>
          </button>
          <!-- Search -->
          <button data-nav-key="search" data-dom-id="open-command-palette-ribbon" class="w-9 h-9 flex items-center justify-center rounded-md transition-colors hover:opacity-80" style="color: var(--note-ink-2);" title="搜索">
            <i data-lucide="search" class="w-5 h-5"></i>
          </button>
          <!-- Graph (Active) -->
          <button data-nav-key="graph" data-dom-id="nav-graph" class="w-9 h-9 flex items-center justify-center rounded-md transition-colors" style="background: var(--note-brand-600); color: #FFFFFF;" title="图谱视图">
            <i data-lucide="git-fork" class="w-5 h-5"></i>
          </button>
          <!-- Plugins -->
          <button data-nav-key="plugins" data-dom-id="nav-plugins" class="w-9 h-9 flex items-center justify-center rounded-md transition-colors hover:opacity-80" style="color: var(--note-ink-2);" title="插件市场">
            <i data-lucide="puzzle" class="w-5 h-5"></i>
          </button>
          <!-- Settings -->
          <button data-nav-key="settings" data-dom-id="nav-settings" class="w-9 h-9 flex items-center justify-center rounded-md transition-colors hover:opacity-80" style="color: var(--note-ink-2);" title="设置">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </button>
          <!-- Spacer -->
          <div class="flex-1"></div>
          <!-- Bottom: sync status -->
          <div class="w-2 h-2 rounded-full" style="background: var(--state-success);" title="已同步"></div>
        </nav>

        <!-- ===== Content Area — 图谱视图 ===== -->
        <div class="flex-1 flex overflow-hidden" style="background: var(--note-background);">

          <!-- ===== 左侧过滤面板 (220px) ===== -->
          <aside class="w-[220px] flex flex-col border-r overflow-y-auto no-scrollbar" style="border-color: var(--note-border); background: var(--note-surface);">
            <!-- 面板标题 -->
            <div class="px-4 py-3 border-b flex items-center justify-between" style="border-color: var(--note-border);">
              <span class="text-[13px] font-semibold tracking-wide" style="color: var(--note-ink);">过滤器</span>
              <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5" style="color: var(--note-ink-3);"></i>
            </div>

            <!-- 分组1: 标签过滤 -->
            <div class="px-4 py-3">
              <div class="flex items-center justify-between mb-2.5">
                <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--note-ink-3);">标签过滤</span>
                <span class="text-[10px] nums" style="color: var(--note-ink-3);">5/45</span>
              </div>
              <div class="space-y-1.5">
                <!-- #日记 -->
                <label class="flex items-center gap-2 cursor-pointer group py-1">
                  <input type="checkbox" class="sr-only peer" checked>
                  <span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);">
                    <i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i>
                  </span>
                  <span class="w-2 h-2 rounded-full" style="background: #F59E0B;"></span>
                  <span class="text-[12px] flex-1" style="color: var(--note-ink);">#日记</span>
                  <span class="text-[11px] nums" style="color: var(--note-ink-3);">12</span>
                </label>
                <!-- #计划 -->
                <label class="flex items-center gap-2 cursor-pointer group py-1">
                  <input type="checkbox" class="sr-only peer" checked>
                  <span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);">
                    <i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i>
                  </span>
                  <span class="w-2 h-2 rounded-full" style="background: #3B82F6;"></span>
                  <span class="text-[12px] flex-1" style="color: var(--note-ink);">#计划</span>
                  <span class="text-[11px] nums" style="color: var(--note-ink-3);">8</span>
                </label>
                <!-- #学习 -->
                <label class="flex items-center gap-2 cursor-pointer group py-1">
                  <input type="checkbox" class="sr-only peer" checked>
                  <span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);">
                    <i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i>
                  </span>
                  <span class="w-2 h-2 rounded-full" style="background: #22C55E;"></span>
                  <span class="text-[12px] flex-1" style="color: var(--note-ink);">#学习</span>
                  <span class="text-[11px] nums" style="color: var(--note-ink-3);">15</span>
                </label>
                <!-- #技术 -->
                <label class="flex items-center gap-2 cursor-pointer group py-1">
                  <input type="checkbox" class="sr-only peer">
                  <span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);">
                    <i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i>
                  </span>
                  <span class="w-2 h-2 rounded-full" style="background: #EF4444;"></span>
                  <span class="text-[12px] flex-1" style="color: var(--note-ink-2);">#技术</span>
                  <span class="text-[11px] nums" style="color: var(--note-ink-3);">6</span>
                </label>
                <!-- #读书 -->
                <label class="flex items-center gap-2 cursor-pointer group py-1">
                  <input type="checkbox" class="sr-only peer">
                  <span class="w-3.5 h-3.5 rounded-[3px] border flex items-center justify-center peer-checked:bg-[#7C3AED] peer-checked:border-[#7C3AED] transition-colors" style="border-color: var(--note-border);">
                    <i data-lucide="check" class="w-2.5 h-2.5 text-white hidden peer-checked:block"></i>
                  </span>
                  <span class="w-2 h-2 rounded-full" style="background: #A78BFA;"></span>
                  <span class="text-[12px] flex-1" style="color: var(--note-ink-2);">#读书</span>
                  <span class="text-[11px] nums" style="color: var(--note-ink-3);">4</span>
                </label>
              </div>
            </div>

            <div class="mx-4 border-t" style="border-color: var(--note-border);"></div>

            <!-- 分组2: 连接深度 -->
            <div class="px-4 py-3">
              <div class="flex items-center justify-between mb-2.5">
                <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--note-ink-3);">连接深度</span>
                <span class="text-[10px] nums px-1.5 py-0.5 rounded" style="color: var(--note-brand-400); background: rgba(124,58,237,0.12);">2层</span>
              </div>
              <div class="flex items-center gap-1">
                <button class="flex-1 py-1.5 rounded text-[11px] font-medium transition-colors" style="color: var(--note-ink-3); background: var(--note-surface-2);">1层</button>
                <button class="flex-1 py-1.5 rounded text-[11px] font-medium transition-colors" style="color: #FFFFFF; background: var(--note-brand-600);">2层</button>
                <button class="flex-1 py-1.5 rounded text-[11px] font-medium transition-colors" style="color: var(--note-ink-3); background: var(--note-surface-2);">3层</button>
              </div>

                  <span class="text-[12px] flex-1 truncate" style="color: var(--note-ink);">读书笔记-深度工作</span>

                </div>
                <!-- 连接项 3 -->
                <div class="flex items-center gap-2 px-2 py-1.5 rounded-md transition-colors hover:opacity-80 cursor-pointer" style="background: var(--note-surface-2);">

                  <div class="w-6 h-6 rounded flex items-center justify-center flex-shrink-0" style="background: rgba(239,68,68,0.2);">

                <div class="flex items-center gap-2 px-2 py-1.5 rounded-md transition-colors hover:opacity-80 cursor-pointer" style="background: var(--note-surface-2);">
                  <div class="w-6 h-6 rounded flex items-center justify-center flex-shrink-0" style="background: rgba(34,197,94,0.2);">
                    <i data-lucide="flag" class="w-3 h-3" style="color: #4ADE80;"></i>
                  </div>
                  <span class="text-[12px] flex-1 truncate" style="color: var(--note-ink);">9月目标</span>

                <span>打开笔记</span>
